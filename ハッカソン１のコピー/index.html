<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI翻訳チャット＆通話 プロトタイプ</title>
  <!-- Tailwind CSS (CDN版) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center min-h-screen font-sans antialiased dark">

  <!-- 全体コンテナ -->
  <div id="app-container" class="w-full max-w-xl h-[95vh] bg-slate-900 flex flex-col rounded-3xl shadow-2xl overflow-hidden relative border border-slate-800 m-4">

    <!-- =========================================================
         chat-screen: 通常時に表示される画面（通話開始でスライドアウトする）
         ========================================================= -->
    <div id="chat-screen" class="flex flex-col h-full w-full">

      <!-- 1. ヘッダー領域 -->
      <header class="bg-slate-850 px-6 py-4 flex justify-between items-center border-b border-slate-800 z-10 shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
          <button id="archive-toggle-btn" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl active:scale-95 transition-all cursor-pointer border border-slate-700 text-xs font-bold flex items-center gap-1 shrink-0" title="アーカイブ一覧を表示">
            📂 <span id="archive-btn-text">一覧</span>
          </button>
          <div class="flex items-center gap-3" id="header-user-profile">
            <div class="relative">
              <div class="w-10 h-10 bg-sky-950 text-sky-400 rounded-full flex items-center justify-center font-bold border-2 border-sky-500/35">A</div>
              <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-slate-100 text-sm">Alex</span>
              </div>
              <p class="text-[11px] text-emerald-400 flex items-center gap-1 font-medium">● オンライン</p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="expression-toggle-btn" class="p-2.5 text-slate-400 hover:text-slate-200 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer text-xs font-bold" title="表現の型一覧">📖 表現</button>
          <button id="call-btn" class="p-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl active:scale-95 transition-all cursor-pointer shadow-md text-xs font-bold flex items-center gap-1" title="通話を開始">📞 通話</button>
        </div>
      </header>

      <!-- 表現の「型」一覧パネル（初期状態は非表示） -->
      <section id="expression-panel" class="hidden shrink-0 border-b border-slate-800 bg-slate-900/60 max-h-64 overflow-y-auto">
        <div class="flex gap-2 px-4 pt-3 overflow-x-auto">
          <button class="tab-btn active" data-axis="scene">シーン別</button>
          <button class="tab-btn" data-axis="formality">フォーマル度別</button>
          <button class="tab-btn" data-axis="emotion">感情別</button>
        </div>
        <div id="expression-list" class="px-4 pb-4 pt-2 space-y-3"></div>
      </section>

      <!-- 2. 中央メイン表示エリア -->
      <main id="chat-area" class="flex-1 overflow-y-auto p-6 space-y-6 relative bg-gradient-to-b from-slate-900 to-slate-950">
        <div id="typing-indicator" class="hidden absolute top-4 left-6 right-6 bg-slate-800/80 border border-slate-700/50 backdrop-blur-md text-slate-300 text-xs py-2 px-4 rounded-xl items-center gap-2 shadow-md z-20">
          <span class="flex space-x-1">
            <span class="w-1.5 h-1.5 bg-sky-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
            <span class="w-1.5 h-1.5 bg-sky-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
            <span class="w-1.5 h-1.5 bg-sky-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
          </span>
          <span>Alex が入力中...</span>
        </div>
        <!-- ここに .chat-bubble が動的に追加される（js/chat.js） -->
      </main>

      <!-- アーカイブ画面（一覧） -->
      <main id="archive-area" class="flex-1 overflow-y-auto p-6 relative bg-slate-950 hidden">
        <div class="max-w-md mx-auto space-y-5 pb-20">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-slate-100 tracking-wide">アーカイブされたトピック</h2>
            <div class="flex items-center gap-2">
              <button id="archive-save-btn" class="text-[11px] px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold cursor-pointer" title="現在の会話履歴を保存">保存</button>
              <button id="archive-load-btn" class="text-[11px] px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold border border-slate-700 cursor-pointer" title="保存済みの会話履歴を読込">読込</button>
            </div>
          </div>
          <p id="archive-message" class="text-xs text-slate-500 font-mono"></p>
          <div id="archive-list" class="space-y-3"></div>
        </div>
      </main>

      <!-- 3. 下部入力フッター領域 -->
      <footer id="chat-footer" class="bg-slate-850 p-4 border-t border-slate-800 z-10 shrink-0 shadow-2xl transition-all duration-300">
        <div class="flex items-end gap-3">
          <div class="flex-1 relative">
            <textarea id="chat-input" rows="1" placeholder="メッセージを入力... (Shift+Enterで改行)" maxlength="1000" class="w-full bg-slate-900 text-slate-100 placeholder-slate-500 text-sm rounded-xl pl-3 pr-3 py-4 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-slate-950 transition-all resize-none min-h-[56px] max-h-[120px] leading-relaxed"></textarea>
          </div>

          <button id="send-btn" disabled class="h-14 w-14 bg-sky-600 hover:bg-sky-500 text-white rounded-xl active:scale-95 transition-all shadow-md flex flex-col items-center justify-center cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
            <span class="text-lg">➔</span>
            <span id="send-btn-status" class="text-[9px] text-sky-200 font-mono tracking-tighter">READY</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- =========================================================
         call-screen: 通話モック画面（初期状態は画面外・非表示）
         ========================================================= -->
    <div id="call-screen" class="absolute inset-0 flex flex-col items-center justify-between p-8 text-white bg-slate-950 translate-x-full">
      <div class="text-center mt-12 space-y-3">
        <div class="w-24 h-24 bg-slate-900 rounded-full mx-auto flex items-center justify-center text-3xl font-bold border-2 border-sky-500 shadow-xl shadow-sky-500/20 animate-pulse">A</div>
        <h3 class="text-xl font-bold tracking-wide">Alex と通話中</h3>
        <p id="call-timer" class="font-mono text-sky-400 bg-slate-900 px-4 py-1 rounded-full text-sm inline-block border border-slate-800">00:00</p>
      </div>
      <button id="hangup-btn" class="mb-8 p-4 bg-rose-600 text-white rounded-full hover:bg-rose-500 active:scale-95 transition-all shadow-lg cursor-pointer">❌ 切断</button>
    </div>

    <!-- 連打防止用の透明オーバーレイ（call-btnのみz-indexで例外化） -->
    <div id="input-lock-overlay" class="hidden fixed inset-0 z-[500]" aria-hidden="true"></div>

    <!-- フレーズハイライト用ツールチップ（使い回し） -->
    <div id="tooltip" class="hidden fixed z-[700] max-w-[240px] bg-slate-100 text-slate-900 text-xs rounded-lg shadow-xl p-3 leading-relaxed"></div>

  </div>

  <script type="module" src="./js/main.js" defer></script>
</body>
</html>
